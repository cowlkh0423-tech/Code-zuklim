<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CODE : 죽림고수</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- =====================================================
         게임 전체
    ====================================================== -->

    <main id="game-wrapper">


        <!-- =================================================
             게임 화면
        ================================================== -->

        <canvas
            id="gameCanvas"
        ></canvas>


        <!-- =================================================
             HUD
        ================================================== -->

        <section
            id="hud"
            class="hud hidden"
        >


            <!-- 체력 -->

            <div
                class="hud-box health-box"
            >

                <span class="hud-label">
                    LIFE
                </span>

                <span
                    id="health"
                    class="health"
                >
                    ♥
                </span>

            </div>


            <!-- 시간 -->

            <div
                class="hud-box timer-box"
            >

                <span class="hud-label">
                    SURVIVAL
                </span>

                <span
                    id="time"
                    class="timer"
                >
                    00.00
                </span>

            </div>


            <!-- 최고 기록 -->

            <div
                class="hud-box best-box"
            >

                <span class="hud-label">
                    BEST
                </span>

                <span
                    id="best-time"
                    class="best-time"
                >
                    00.00
                </span>

            </div>


        </section>


        <!-- =================================================
             시작 화면
        ================================================== -->

        <section
            id="start-screen"
            class="screen"
        >

            <div class="title-area">

                <p class="subtitle">
                    BAMBOO SURVIVAL
                </p>

                <h1>
                    CODE
                </h1>

                <h2>
                    죽림고수
                </h2>

                <p class="description">
                    화살을 피하고<br>
                    최대한 오래 살아남아라.
                </p>

            </div>


            <div class="control-guide">

                <div class="wasd">

                    <span>W</span>

                    <div>

                        <span>A</span>
                        <span>S</span>
                        <span>D</span>

                    </div>

                </div>


                <p>
                    WASD로 이동
                </p>

            </div>


            <button
                id="start-button"
                class="game-button"
            >
                게임 시작
            </button>


        </section>


        <!-- =================================================
             게임 오버
        ================================================== -->

        <section
            id="game-over-screen"
            class="screen hidden"
        >

            <div class="game-over-card">

                <p class="subtitle">
                    SURVIVAL ENDED
                </p>

                <h2>
                    GAME OVER
                </h2>


                <div class="result">

                    <div>

                        <span>
                            SURVIVAL TIME
                        </span>

                        <strong
                            id="final-time"
                        >
                            00.00
                        </strong>

                    </div>


                    <div>

                        <span>
                            BEST RECORD
                        </span>

                        <strong
                            id="result-best-time"
                        >
                            00.00
                        </strong>

                    </div>

                </div>


                <button
                    id="restart-button"
                    class="game-button"
                >
                    다시 시작
                </button>


                <p class="restart-guide">
                    또는 R 키를 눌러 다시 시작
                </p>

            </div>

        </section>


        <!-- =================================================
             시작 전 조작 안내
        ================================================== -->

        <div
            id="bottom-guide"
            class="bottom-guide"
        >

            <span>
                W
            </span>

            <span>
                A
            </span>

            <span>
                S
            </span>

            <span>
                D
            </span>

            <b>
                MOVE
            </b>

        </div>


    </main>


    <!-- =====================================================
         JavaScript
    ====================================================== -->

    <script
        type="module"
        src="js/main.js"
    ></script>


</body>

</html>
