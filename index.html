<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#071008"
    >

    <title>CODE : 죽림고수</title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

</head>


<body>


    <!-- =====================================================
         게임 전체
    ====================================================== -->

    <div id="game-wrapper">


        <!-- =================================================
             게임 Canvas
        ================================================== -->

        <canvas id="gameCanvas"></canvas>


        <!-- =================================================
             HUD
        ================================================== -->

        <div
            id="hud"
            class="hud hidden"
        >


            <!-- 체력 -->

            <div class="hud-box">

                <span class="hud-label">
                    LIFE
                </span>

                <span
                    id="health"
                    class="health"
                >
                    ♥
                </span>

            </div>


            <!-- 시간 -->

            <div
                class="hud-box timer-box"
            >

                <span class="hud-label">
                    SURVIVAL
                </span>

                <span
                    id="time"
                    class="timer"
                >
                    00.00
                </span>

            </div>


            <!-- 최고 기록 -->

            <div class="hud-box">

                <span class="hud-label">
                    BEST
                </span>

                <span
                    id="best-time"
                    class="best-time"
                >
                    00.00
                </span>

            </div>


        </div>


        <!-- =================================================
             시작 화면
        ================================================== -->

        <section
            id="start-screen"
            class="screen"
        >


            <div class="title-area">

                <div class="subtitle">
                    SURVIVAL ARCHERY
                </div>

                <h1>
                    CODE
                </h1>

                <h2>
                    죽림고수
                </h2>

                <p class="description">

                    대나무 숲을 가르는 화살을 피해<br>

                    단 하나의 목숨으로 최대한 오래 살아남아라.

                </p>

            </div>


            <!-- =================================================
                 조작 설명
            ================================================== -->

            <div class="control-guide">


                <div class="wasd">

                    <span>
                        W
                    </span>

                    <div>

                        <span>
                            A
                        </span>

                        <span>
                            S
                        </span>

                        <span>
                            D
                        </span>

                    </div>

                </div>


                <p>
                    WASD로 이동
                </p>


            </div>


            <!-- =================================================
                 시작 버튼
            ================================================== -->

            <button
                id="start-button"
                class="game-button"
            >
                게임 시작
            </button>


        </section>


        <!-- =================================================
             하단 조작 안내
        ================================================== -->

        <div
            id="bottom-guide"
            class="bottom-guide hidden"
        >

            <span>
                W
            </span>

            <span>
                A
            </span>

            <span>
                S
            </span>

            <span>
                D
            </span>

            <b>
                이동
            </b>

        </div>


        <!-- =================================================
             게임오버 화면
        ================================================== -->

        <section
            id="game-over-screen"
            class="screen hidden"
        >


            <div class="game-over-card">


                <h2>
                    GAME OVER
                </h2>


                <!-- 결과 -->

                <div class="result">


                    <div>

                        <span>
                            SURVIVAL TIME
                        </span>

                        <strong
                            id="final-time"
                        >
                            00.00
                        </strong>

                    </div>


                    <div>

                        <span>
                            BEST RECORD
                        </span>

                        <strong
                            id="result-best-time"
                        >
                            00.00
                        </strong>

                    </div>


                </div>


                <!-- 재시작 -->

                <button
                    id="restart-button"
                    class="game-button"
                >
                    다시 시작
                </button>


                <p class="restart-guide">
                    R 키를 눌러도 다시 시작할 수 있습니다.
                </p>


            </div>


        </section>


    </div>


    <!-- =====================================================
         JavaScript
    ====================================================== -->

    <script
        type="module"
        src="./js/main.js"
    ></script>


</body>

</html>
